<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>مِشْكاة المعرفة — الموسوعة الثقافية الشاملة</title>
  <!-- خطوط عربية متناغمة من Google Fonts (الاعتماد الخارجي الوحيد) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;600;700&family=Reem+Kufi:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    /* =========================================================================
       1. المتغيرات اللونية والهوية البصرية (الوضع الداكن الزمردي + الفاتح الدافئ)
       ========================================================================= */
    :root {
      --bg: #eef3ee;
      --bg-soft: #e3ece4;
      --card: #fafcf8;
      --card-glass: rgba(250, 252, 248, 0.88);
      --tx: #182923;
      --mu: #526a61;
      --ac: #247253;
      --ac-hover: #1d5d44;
      --ac-glow: rgba(36, 114, 83, 0.22);
      --acx: #ffffff;
      --gold: #b57e1d;
      --gold-bg: rgba(181, 126, 29, 0.14);
      --bd: #cfdcd1;
      --bad: #b84b34;
      --bad-bg: rgba(184, 75, 52, 0.12);
      --good: #1c8556;
      --good-bg: rgba(28, 133, 86, 0.13);
      --warn: #b97a10;
      --warn-bg: rgba(185, 122, 16, 0.14);
      --shadow: 0 10px 28px rgba(17, 36, 28, 0.08);
      --shadow-lg: 0 18px 42px rgba(17, 36, 28, 0.15);

      /* تدرجات التصنيفات في الوضع الفاتح */
      --g-s: linear-gradient(145deg, #d7efef, #a9dad6); --c-s: #125d57;
      --g-h: linear-gradient(145deg, #f5e3cf, #e5be96); --c-h: #824916;
      --g-p: linear-gradient(145deg, #e5e1f6, #c6bce8); --c-p: #4f3a8f;
      --g-l: linear-gradient(145deg, #f9e1e9, #ecbfd0); --c-l: #94294c;
      --g-g: linear-gradient(145deg, #d9edf8, #b0d7f0); --c-g: #165e8c;
      --g-m: linear-gradient(145deg, #dcf4e5, #b1e2c5); --c-m: #176e40;
      --g-t: linear-gradient(145deg, #dde7fa, #b8cef4); --c-t: #234b91;
      --g-a: linear-gradient(145deg, #f9e6da, #eec7ae); --c-a: #95421a;
      --g-o: linear-gradient(145deg, #dfeedb, #b9d7b2); --c-o: #2b613f;
    }

    :root[data-theme="dark"] {
      --bg: #0c1514;
      --bg-soft: #111e1c;
      --card: #152220;
      --card-glass: rgba(21, 34, 32, 0.86);
      --tx: #e7f0ea;
      --mu: #95aba3;
      --ac: #8fd0a9;
      --ac-hover: #a2dbba;
      --ac-glow: rgba(143, 208, 169, 0.24);
      --acx: #091912;
      --gold: #ebc87e;
      --gold-bg: rgba(235, 200, 126, 0.14);
      --bd: #243739;
      --bad: #e68c72;
      --bad-bg: rgba(230, 140, 114, 0.14);
      --good: #6fd89f;
      --good-bg: rgba(111, 216, 159, 0.14);
      --warn: #ebc87e;
      --warn-bg: rgba(235, 200, 126, 0.14);
      --shadow: 0 10px 28px rgba(0, 0, 0, 0.24);
      --shadow-lg: 0 20px 48px rgba(0, 0, 0, 0.42);

      /* تدرجات التصنيفات في الوضع الداكن */
      --g-s: linear-gradient(145deg, #0f393f, #1e6c6a); --c-s: #82e8e0;
      --g-h: linear-gradient(145deg, #3b2316, #7a4c2a); --c-h: #f4c682;
      --g-p: linear-gradient(145deg, #211e47, #4c407d); --c-p: #cabcf9;
      --g-l: linear-gradient(145deg, #3f1928, #732f49); --c-l: #f8abc3;
      --g-g: linear-gradient(145deg, #112d42, #21577a); --c-g: #87d2f8;
      --g-m: linear-gradient(145deg, #123727, #226949); --c-m: #88eab3;
      --g-t: linear-gradient(145deg, #172544, #2b4a84); --c-t: #9ac2ff;
      --g-a: linear-gradient(145deg, #3e2318, #75432e); --c-a: #f8b895;
      --g-o: linear-gradient(145deg, #1d3321, #406648); --c-o: #a6e3bc;
    }

    /* =========================================================================
       2. القواعد الأساسية والخطوط والتجاوب
       ========================================================================= */
    *, *::before, *::after {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background-color: var(--bg);
      color: var(--tx);
      font-family: "Noto Naskh Arabic", Tahoma, serif;
      font-size: 16px;
      line-height: 1.72;
      background-image:
        radial-gradient(920px 500px at 88% -8%, var(--ac-glow), transparent),
        radial-gradient(700px 460px at 5% 35%, rgba(127, 196, 212, 0.08), transparent),
        radial-gradient(560px 420px at 50% 98%, rgba(235, 200, 126, 0.06), transparent);
      background-attachment: fixed;
      overflow-x: hidden;
      padding-bottom: 84px;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    h1, h2, h3, h4, button, .kufi, select, .chip, .tag, .pill {
      font-family: "Reem Kufi", Tahoma, sans-serif;
    }

    button {
      font-family: "Reem Kufi", Tahoma, sans-serif;
      color: inherit;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    input, textarea, select {
      font-family: inherit;
      color: var(--tx);
      background: var(--bg);
      border: 1px solid var(--bd);
      border-radius: 14px;
      padding: 11px 14px;
      font-size: 0.95rem;
      width: 100%;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    input:focus, textarea:focus, select:focus {
      border-color: var(--ac);
      box-shadow: 0 0 0 3px var(--ac-glow);
    }

    /* ألوان التصنيفات */
    .cat-s { --cat-bg: var(--g-s); --cat-ac: var(--c-s); }
    .cat-h { --cat-bg: var(--g-h); --cat-ac: var(--c-h); }
    .cat-p { --cat-bg: var(--g-p); --cat-ac: var(--c-p); }
    .cat-l { --cat-bg: var(--g-l); --cat-ac: var(--c-l); }
    .cat-g { --cat-bg: var(--g-g); --cat-ac: var(--c-g); }
    .cat-m { --cat-bg: var(--g-m); --cat-ac: var(--c-m); }
    .cat-t { --cat-bg: var(--g-t); --cat-ac: var(--c-t); }
    .cat-a { --cat-bg: var(--g-a); --cat-ac: var(--c-a); }
    .cat-o { --cat-bg: var(--g-o); --cat-ac: var(--c-o); }

    /* خلفية التلال المتحركة بنعومة */
    .hills-wrap {
      position: fixed;
      inset: auto 0 0 0;
      width: 100%;
      height: 165px;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
      color: var(--ac);
    }

    .hills-svg {
      width: 112%;
      height: 100%;
      margin-right: -6%;
      display: block;
    }

    .hill-wave-1 {
      animation: hillDrift 16s ease-in-out infinite alternate;
    }

    .hill-wave-2 {
      animation: hillDrift 22s ease-in-out infinite alternate-reverse;
    }

    @keyframes hillDrift {
      from { transform: translateX(-18px); }
      to { transform: translateX(18px); }
    }

    /* الحاوية الرئيسية */
    .app-shell {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 1160px;
      margin: 0 auto;
      padding: 18px 16px 24px;
    }

    @media (min-width: 640px) {
      .app-shell { padding: 24px 22px 30px; }
    }

    /* =========================================================================
       3. الشريط العلوي (Top HUD) والبطاقات الأساسية
       ========================================================================= */
    .hud-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .brand-logo {
      width: 48px;
      height: 48px;
      border-radius: 16px;
      background: var(--ac);
      color: var(--acx);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.55rem;
      box-shadow: 0 8px 20px var(--ac-glow);
      flex-shrink: 0;
    }

    .brand h1 {
      margin: 0;
      font-size: clamp(1.3rem, 2.8vw, 1.85rem);
      line-height: 1.2;
      font-weight: 700;
    }

    .brand-sub {
      margin: 2px 0 0;
      font-size: 0.83rem;
      color: var(--mu);
    }

    .hud-controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .hud-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 13px;
      min-height: 40px;
      border-radius: 999px;
      background: var(--card-glass);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid var(--bd);
      box-shadow: var(--shadow);
      font-size: 0.86rem;
      font-weight: 600;
      transition: transform 0.16s ease, border-color 0.2s ease, opacity 0.2s ease;
    }

    .hud-pill:hover { border-color: var(--ac); }
    .hud-pill:active { transform: scale(0.96); }

    .sheet-group {
      display: inline-flex;
      align-items: stretch;
      border-radius: 999px;
      background: var(--card-glass);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid var(--bd);
      box-shadow: var(--shadow);
      overflow: hidden;
      transition: border-color 0.2s ease;
    }

    .sheet-group.is-ok { border-color: var(--ac); }
    .sheet-group.is-warn { border-color: var(--warn); }
    .sheet-group.is-err { border-color: var(--bad); }

    .sheet-status-btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 13px;
      min-height: 40px;
      border: 0;
      background: transparent;
      font-size: 0.84rem;
      font-weight: 600;
    }

    .sheet-refresh-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 12px;
      min-height: 40px;
      min-width: 40px;
      border: 0;
      border-right: 1px solid var(--bd);
      background: transparent;
      font-size: 0.95rem;
      transition: background 0.2s ease;
    }

    .sheet-refresh-btn:hover { background: var(--ac-glow); }

    .spin {
      display: inline-block;
      animation: spin360 1s linear infinite;
    }

    @keyframes spin360 {
      to { transform: rotate(360deg); }
    }

    /* البطاقات السطحية والزجاجية */
    .surface {
      background: var(--card-glass);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid var(--bd);
      border-radius: 22px;
      box-shadow: var(--shadow);
    }

    .themed-card {
      background: var(--cat-bg, var(--card));
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 22px;
      box-shadow: var(--shadow);
      color: var(--tx);
    }

    /* بانر الإشراقة المعرفية */
    .spotlight {
      padding: 16px 18px;
      margin-bottom: 16px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .spotlight-body {
      flex: 1 1 320px;
      min-width: 0;
    }

    .spotlight-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }

    .spotlight-text {
      margin: 0;
      font-size: 0.98rem;
      line-height: 1.72;
    }

    .spotlight-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    /* =========================================================================
       4. شريط التنقل الرئيسي (6 تبويبات)
       ========================================================================= */
    .main-nav {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin-bottom: 16px;
    }

    @media (min-width: 768px) {
      .main-nav {
        grid-template-columns: repeat(6, minmax(0, 1fr));
        gap: 10px;
      }
    }

    .nav-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 11px 8px;
      min-height: 46px;
      border-radius: 16px;
      border: 1px solid var(--bd);
      background: var(--card-glass);
      color: var(--tx);
      font-size: 0.86rem;
      font-weight: 600;
      transition: transform 0.15s ease, box-shadow 0.2s ease, background 0.2s ease, border-color 0.2s ease;
    }

    .nav-btn:hover { border-color: var(--ac); }
    .nav-btn:active { transform: scale(0.97); }

    .nav-btn.active {
      background: var(--ac);
      color: var(--acx);
      border-color: var(--ac);
      box-shadow: 0 6px 18px var(--ac-glow);
    }

    .nav-btn span.lbl {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* تنبيه بطاقات اليوم */
    .daily-nudge {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 16px;
      margin-bottom: 16px;
      border-radius: 18px;
      border: 1px solid var(--ac);
      background: var(--card-glass);
      cursor: pointer;
      transition: transform 0.16s ease;
    }

    .daily-nudge:hover { transform: translateY(-1px); }

    /* =========================================================================
       5. الأزرار والشارات والفلاتر
       ========================================================================= */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 11px 18px;
      min-height: 44px;
      border-radius: 14px;
      border: 1px solid transparent;
      font-size: 0.92rem;
      font-weight: 600;
      transition: transform 0.14s ease, filter 0.18s ease, background 0.18s ease;
      text-decoration: none;
    }

    .btn:hover:not(:disabled) { filter: brightness(1.06); }
    .btn:active:not(:disabled) { transform: scale(0.97); }

    .btn-primary {
      background: var(--ac);
      color: var(--acx);
      box-shadow: 0 6px 18px var(--ac-glow);
    }

    .btn-ghost {
      background: var(--bg);
      color: var(--tx);
      border-color: var(--bd);
    }

    .btn-outline-ac {
      background: transparent;
      color: var(--ac);
      border-color: var(--ac);
    }

    .btn-bad {
      background: var(--bad);
      color: #ffffff;
    }

    .btn-gold {
      background: var(--gold-bg);
      color: var(--gold);
      border-color: var(--gold);
    }

    .btn-sm {
      padding: 7px 12px;
      min-height: 36px;
      font-size: 0.82rem;
      border-radius: 12px;
    }

    .btn-block { width: 100%; }

    .badge-sheet {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 10px;
      border-radius: 999px;
      background: var(--ac);
      color: var(--acx);
      font-size: 0.72rem;
      font-weight: 700;
      box-shadow: 0 3px 10px var(--ac-glow);
    }

    .tag-cat {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 10px;
      border-radius: 999px;
      border: 1px solid var(--cat-ac, var(--ac));
      color: var(--cat-ac, var(--ac));
      background: rgba(0, 0, 0, 0.14);
      font-size: 0.76rem;
      font-weight: 600;
    }

    :root[data-theme="light"] .tag-cat {
      background: rgba(255, 255, 255, 0.55);
    }

    .tag-gold {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 10px;
      border-radius: 999px;
      background: var(--gold-bg);
      color: var(--gold);
      font-size: 0.76rem;
      font-weight: 600;
    }

    /* =========================================================================
       6. الشبكات والموسوعة
       ========================================================================= */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 16px;
    }

    @media (min-width: 640px) {
      .stats-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    }

    .stat-box {
      padding: 13px 10px;
      text-align: center;
      border-radius: 18px;
      transition: transform 0.16s ease, border-color 0.2s ease;
    }

    .stat-box.clickable { cursor: pointer; }
    .stat-box.clickable:hover { transform: translateY(-2px); border-color: var(--ac); }

    .stat-box b {
      display: block;
      font-family: "Reem Kufi", sans-serif;
      font-size: 1.55rem;
      line-height: 1.25;
    }

    .stat-box span {
      font-size: 0.78rem;
      color: var(--mu);
    }

    .filter-panel {
      padding: 16px;
      margin-bottom: 14px;
    }

    .search-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 12px;
    }

    .search-box {
      position: relative;
      flex: 1 1 260px;
    }

    .search-box input {
      padding-right: 40px;
      padding-left: 36px;
    }

    .search-icon {
      position: absolute;
      right: 13px;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
      opacity: 0.65;
    }

    .search-clear {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      border: 0;
      background: transparent;
      color: var(--mu);
      font-size: 0.9rem;
      padding: 4px 6px;
    }

    .chips-row {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }

    .chips-row::-webkit-scrollbar { display: none; }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
      padding: 7px 14px;
      min-height: 38px;
      border-radius: 999px;
      border: 1px solid var(--bd);
      background: var(--bg);
      color: var(--tx);
      font-size: 0.84rem;
      font-weight: 600;
      transition: all 0.18s ease;
    }

    .chip:hover { border-color: var(--ac); }

    .chip.on {
      background: var(--ac);
      color: var(--acx);
      border-color: var(--ac);
      box-shadow: 0 4px 14px var(--ac-glow);
    }

    .chip.sheet-chip {
      border-color: var(--ac);
    }

    .chip.fav-chip.on {
      background: var(--gold);
      color: #151208;
      border-color: var(--gold);
    }

    .facts-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
    }

    @media (min-width: 680px) {
      .facts-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (min-width: 1024px) {
      .facts-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }

    .fact-card {
      padding: 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      position: relative;
    }

    .fact-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-lg);
    }

    .fact-card.from-sheet {
      border: 2px solid var(--ac);
    }

    .fact-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
    }

    .fact-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }

    .fact-tools {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }

    .icon-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 0;
      background: rgba(0, 0, 0, 0.14);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.95rem;
      transition: background 0.18s ease, transform 0.14s ease;
    }

    :root[data-theme="light"] .icon-btn {
      background: rgba(255, 255, 255, 0.55);
    }

    .icon-btn:hover { background: rgba(0, 0, 0, 0.28); }
    .icon-btn:active { transform: scale(0.92); }

    .fact-q {
      margin: 0 0 8px;
      font-size: 1.06rem;
      font-weight: 700;
      line-height: 1.48;
    }

    .fact-a {
      margin: 0;
      font-size: 0.93rem;
      opacity: 0.92;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .fact-foot {
      margin-top: 14px;
      padding-top: 11px;
      border-top: 1px solid rgba(255, 255, 255, 0.16);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    :root[data-theme="light"] .fact-foot {
      border-top-color: rgba(0, 0, 0, 0.1);
    }

    .mini-pill {
      border: 0;
      border-radius: 10px;
      padding: 6px 11px;
      font-size: 0.78rem;
      font-weight: 600;
      background: rgba(0, 0, 0, 0.22);
      color: var(--tx);
      transition: opacity 0.18s ease;
    }

    :root[data-theme="light"] .mini-pill {
      background: rgba(255, 255, 255, 0.65);
    }

    /* =========================================================================
       7. بطاقات اليوم ثلاثية الأبعاد (3D Flip Cards)
       ========================================================================= */
    .narrow-wrap {
      width: 100%;
      max-width: 680px;
      margin: 0 auto;
    }

    .medium-wrap {
      width: 100%;
      max-width: 820px;
      margin: 0 auto;
    }

    .progress-track {
      width: 100%;
      height: 10px;
      border-radius: 999px;
      background: var(--bd);
      overflow: hidden;
      margin-bottom: 18px;
    }

    .progress-fill {
      height: 100%;
      border-radius: 999px;
      background: var(--ac);
      transition: width 0.4s ease;
    }

    .flip-wrap {
      perspective: 1200px;
      cursor: pointer;
      margin-bottom: 18px;
    }

    .flip-inner {
      position: relative;
      width: 100%;
      min-height: 320px;
      transform-style: preserve-3d;
      transition: transform 0.65s cubic-bezier(0.34, 1.45, 0.64, 1);
    }

    .flip-wrap.flipped .flip-inner {
      transform: rotateY(180deg);
    }

    .flip-face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: 26px;
      padding: 28px 24px;
      background: var(--cat-bg, var(--card));
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: var(--shadow-lg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      overflow-y: auto;
    }

    .flip-back {
      transform: rotateY(180deg);
    }

    .float-icon {
      font-size: 3rem;
      line-height: 1.1;
      margin-bottom: 10px;
      animation: floatSoft 3.6s ease-in-out infinite;
    }

    @keyframes floatSoft {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-7px); }
    }

    .row-2 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .row-3 {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .stack-md {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }

    @media (min-width: 768px) {
      .stack-md { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    /* =========================================================================
       8. شارات الإنجاز + تحدي الثقافة + ويكيبيديا + حقيبتي
       ========================================================================= */
    .badges-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    @media (min-width: 600px) {
      .badges-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    }

    .badge-item {
      padding: 13px 8px;
      border-radius: 18px;
      border: 1px dashed var(--bd);
      background: var(--bg);
      text-align: center;
      opacity: 0.48;
      filter: grayscale(1);
      transition: all 0.25s ease;
    }

    .badge-item.unlocked {
      opacity: 1;
      filter: none;
      border-style: solid;
      border-color: var(--ac);
      animation: badgeGlow 2.4s infinite alternate;
    }

    @keyframes badgeGlow {
      from { box-shadow: 0 0 0 rgba(143, 208, 169, 0); }
      to { box-shadow: 0 0 18px var(--ac-glow); }
    }

    .quiz-opt {
      width: 100%;
      text-align: right;
      padding: 15px 16px;
      border-radius: 18px;
      border: 1px solid var(--bd);
      background: var(--card);
      color: var(--tx);
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 10px;
      font-family: "Noto Naskh Arabic", serif;
      font-size: 0.98rem;
      line-height: 1.6;
      transition: border-color 0.18s ease, transform 0.14s ease, background 0.18s ease;
    }

    .quiz-opt:hover:not(:disabled) {
      border-color: var(--ac);
      transform: translateX(-2px);
    }

    .quiz-opt.correct {
      background: var(--good);
      border-color: var(--good);
      color: #ffffff;
    }

    .quiz-opt.wrong {
      background: var(--bad);
      border-color: var(--bad);
      color: #ffffff;
    }

    .quiz-opt.dimmed { opacity: 0.52; }

    .opt-letter {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.16);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-family: "Reem Kufi", sans-serif;
      font-weight: 700;
      font-size: 0.85rem;
      flex-shrink: 0;
    }

    .wiki-card-flex {
      display: flex;
      flex-direction: column;
      gap: 18px;
      align-items: flex-start;
    }

    @media (min-width: 640px) {
      .wiki-card-flex { flex-direction: row; }
    }

    .wiki-thumb {
      width: 100%;
      max-height: 240px;
      object-fit: cover;
      border-radius: 18px;
      border: 1px solid var(--bd);
      flex-shrink: 0;
    }

    @media (min-width: 640px) {
      .wiki-thumb {
        width: 190px;
        height: 190px;
      }
    }

    .srs-list-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid var(--bd);
    }

    .srs-list-item:last-child { border-bottom: 0; }

    /* =========================================================================
       9. النوافذ المنبثقة (Modals) والإشعارات (Toast)
       ========================================================================= */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 80;
      background: rgba(0, 0, 0, 0.72);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      overflow-y: auto;
      animation: fadePop 0.22s ease-out;
    }

    .modal-box {
      width: 100%;
      max-width: 620px;
      max-height: 92vh;
      overflow-y: auto;
      border-radius: 26px;
      padding: 24px 22px;
      position: relative;
      box-shadow: var(--shadow-lg);
    }

    .modal-close {
      position: absolute;
      left: 16px;
      top: 16px;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1px solid var(--bd);
      background: var(--bg);
      color: var(--tx);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.95rem;
    }

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translate(-50%, 16px);
      z-index: 95;
      padding: 10px 22px;
      border-radius: 999px;
      background: var(--ac);
      color: var(--acx);
      font-family: "Reem Kufi", sans-serif;
      font-size: 0.9rem;
      font-weight: 700;
      box-shadow: var(--shadow-lg);
      opacity: 0;
      pointer-events: none;
      max-width: 92vw;
      text-align: center;
      transition: opacity 0.26s ease, transform 0.26s ease;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    .anim-pop {
      animation: fadePop 0.28s ease-out;
    }

    @keyframes fadePop {
      from { opacity: 0; transform: translateY(6px) scale(0.985); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .muted { color: var(--mu); }
    .text-ac { color: var(--ac); }
    .text-gold { color: var(--gold); }
    .text-good { color: var(--good); }
    .text-bad { color: var(--bad); }
    .text-center { text-align: center; }

    .alert-box {
      padding: 12px 15px;
      border-radius: 16px;
      font-size: 0.88rem;
      margin-bottom: 14px;
      border: 1px solid var(--bd);
    }

    .alert-err {
      background: var(--bad-bg);
      border-color: var(--bad);
      color: var(--bad);
    }

    .alert-ok {
      background: var(--good-bg);
      border-color: var(--good);
      color: var(--good);
    }

    .alert-warn {
      background: var(--warn-bg);
      border-color: var(--warn);
      color: var(--warn);
    }

    @media (prefers-reduced-motion: reduce) {
      .flip-inner, .float-icon, .badge-item.unlocked, .hill-wave-1, .hill-wave-2, .spin, .anim-pop {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>

      ["s", "ما أخف وأبسط عنصر في الجدول الدوري؟", "الهيدروجين (H)؛ تتكون ذرته من بروتون واحد وإلكترون واحد، وهو الوقود الأساسي للنجوم وأكثر العناصر وفرة في الكون."],
      ["s", "ما أصل الكهرباء الساكنة؟", "تراكم غير متوازن للشحنات الكهربائية على سطح مادة نتيجة الاحتكاك، كما يحدث عند فرك بالون بالشعر."],
      ["s", "ما الحمض القوي الموجود في المعدة؟", "حمض الهيدروكلوريك (HCl)؛ يساعد في تفكيك الطعام وقتل الجراثيم، وتحمي المعدة نفسها منه بغشاء مخاطي متجدد."],
      ["s", "كم يستغرق ضوء القمر ليصل إلى الأرض؟", "نحو 1.3 ثانية فقط، لكون متوسط المسافة بين الأرض والقمر يقارب 384,400 كيلومتر."],
      ["s", "ما الكواكب العملاقة الغازية والجليدية في مجموعتنا الشمسية؟", "أربعة كواكب خارجية: المشتري وزحل (غازيان)، وأورانوس ونبتون (جليديان غنيان بالماء والميثان)."],
      ["s", "ما التركيب الكيميائي لملح الطعام؟", "كلوريد الصوديوم (NaCl)، وهو مركب أيوني يتكوّن من اتحاد عنصر الصوديوم مع غاز الكلور."],
      ["s", "ما السبب الحقيقي لتعاقب الفصول الأربعة؟", "ميل محور دوران الأرض بزاوية 23.5 درجة أثناء دورانها حول الشمس، وليس قربها أو بُعدها عن الشمس."],
      ["s", "كم عدد الكروموسومات في الخلية البشرية الطبيعية؟", "46 كروموسوماً مرتبة في 23 زوجاً، يرث الإنسان نصفها من الأم والنصف الآخر من الأب."],
      ["s", "ما أبرد درجة حرارة ممكنة في الفيزياء؟", "الصفر المطلق، ويعادل −273.15 درجة مئوية (صفر كلفن)، حيث تبلغ الطاقة الحرارية للذرات أدنى حد نظري."],
      ["s", "ما المجرة التي تقع فيها مجموعتنا الشمسية؟", "مجرة «درب التبانة»؛ وهي مجرة حلزونية ضلعية يقدّر قطرها بنحو 100 ألف سنة ضوئية وتضم مئات المليارات من النجوم."],
      ["s", "ما أكبر حيوان عاش على الأرض على الإطلاق؟", "الحوت الأزرق؛ قد يصل طوله إلى 30 متراً ووزنه إلى 180 طناً، ويزن قلبه وحده قرابة سيارة صغيرة."],
      ["s", "ما العنصران الأكثر وفرة في القشرة الأرضية؟", "الأكسجين (نحو 46%) يليه السيليكون (نحو 28%)، ويشكّلان معاً معادن السيليكات التي تبني معظم صخور الأرض."],
      ["s", "ما أصغر وحدة في العنصر تحتفظ بخصائصه الكيميائية؟", "الذرة؛ وتتكون من نواة بها بروتونات ونيوترونات وتدور حولها سحابة من الإلكترونات."],
      ["s", "ما الذي يجعل الدم أحمر اللون؟", "بروتين الهيموغلوبين في كريات الدم الحمراء لاحتوائه على ذرات الحديد التي ترتبط بالأكسجين."],
      ["s", "كم يبلغ عمر كوكب الأرض تقريباً؟", "نحو 4.54 مليار سنة، وفقاً للتأريخ الإشعاعي لأقدم النيازك والصخور الأرضية والقمرية."],
      ["s", "ما هو الكوكب الأحمر؟", "المريخ؛ وسُمّي بذلك بسبب الانتشار الواسع لغبار أكسيد الحديد (الصدأ) على سطحه وفي غلافه الجوي الرقيق."],
      ["s", "ما أقرب كوكب إلى الشمس؟", "عطارد؛ يُتم دورته حول الشمس في 88 يوماً أرضياً فقط، لكن الزهرة أشد منه حرارةً لغلافه الجوي الكثيف."],
      ["s", "من اكتشف البنسلين وكيف غيّر الطب؟", "ألكسندر فليمنغ عام 1928م حين لاحظ أن فطراً يمنع نمو البكتيريا، ففتح عصر المضادات الحيوية وأنقذ مئات الملايين."],
      ["s", "ما سبب ظاهرة الاحتباس الحراري؟", "تراكم غازات دفيئة مثل ثاني أكسيد الكربون والميثان في الغلاف الجوي مما يحبس جزءاً من حرارة الشمس."],
      ["s", "من هو ألبرت أينشتاين وما أبرز إنجازاته؟", "عالم فيزياء صاغ النظريتين النسبيتين ومعادلة (E=mc²)، ونال جائزة نوبل عام 1921م عن تفسير التأثير الكهروضوئي."],
      ["s", "لماذا يطفو الجليد فوق الماء السائل؟", "لأن جزيئات الماء عند التجمّد تنتظم في شبكة بلورية مفتوحة أقل كثافة من الماء السائل بنحو 9%، مما يحمي الحياة البحرية."],
      ["s", "ما هي السنة الضوئية؟", "وحدة قياس للمسافة تساوي المسافة التي يقطعها الضوء خلال سنة كاملة، أي نحو 9.46 تريليون كيلومتر."],

      // ===================== [h] تاريخ وحضارات (45 معلومة) =====================
      ["h", "من هو الخوارزمي وما أثره في العلوم؟", "عالم رياضيات في بيت الحكمة ببغداد في القرن التاسع الميلادي؛ من اسمه جاءت كلمة «خوارزمية»، وكتابه «الجبر والمقابلة» أسس علم الجبر."],
      ["h", "متى سقطت القسطنطينية وعلى يد من؟", "عام 1453م على يد السلطان العثماني محمد الفاتح وعمره 21 عاماً، لتنتهي بذلك الإمبراطورية البيزنطية."],
      ["h", "ما هو حجر رشيد؟", "لوح بازلتي كُتب عليه نص بثلاث كتابات (الهيروغليفية والديموطيقية واليونانية) ومكّن شامبليون من فك رموز الهيروغليفية عام 1822م."],
      ["h", "أين نشأت أولى المدن الكبرى في التاريخ؟", "في بلاد سومر ببلاد الرافدين (جنوب العراق)، ومن أقدمها مدينة أوروك نحو 4000 ق.م حيث ابتُكرت الكتابة المسمارية والعجلة."],
      ["h", "من بنى أهرامات الجيزة؟", "ملوك الأسرة الرابعة في الدولة المصرية القديمة (خوفو وخفرع ومنكاورع) قبل نحو 4,500 سنة."],
      ["h", "ما هو بيت الحكمة في بغداد؟", "أعظم مكتبة ومركز للترجمة والبحث العلمي في العصر العباسي، ازدهر في عهد هارون الرشيد والمأمون وجمع علماء الحضارات."],
      ["h", "من هو الحسن بن الهيثم؟", "عالم بصريات ورياضيات (965–1040م) يُعد رائد المنهج التجريبي الحديث، وأثبت في كتابه «المناظر» أن الرؤية تحدث بانعكاس الضوء إلى العين."],
      ["h", "متى وأين بدأت الثورة الصناعية؟", "في بريطانيا خلال القرن الثامن عشر مع تطوير الآلة البخارية وانتشار المصانع والسكك الحديدية."],
      ["h", "متى كانت الحرب العالمية الأولى؟", "بين عامي 1914 و1918م، وأدت إلى سقوط أربع إمبراطوريات كبرى وتغيير خريطة العالم."],
      ["h", "من بنى مدينة بغداد ومتى؟", "الخليفة العباسي أبو جعفر المنصور عام 762م بتصميم دائري فريد وسماها «مدينة السلام»."],
      ["h", "من هو الرحالة ابن بطوطة؟", "رحالة مغربي من طنجة (1304–1369م) قطع أكثر من 120 ألف كيلومتر عبر آسيا وأفريقيا وأوروبا خلال 29 عاماً."],
      ["h", "ما هي مكتبة الإسكندرية القديمة؟", "من أعظم مكتبات العالم القديم ومراكز أبحاثه، أُسست في عهد البطالمة بمصر في القرن الثالث قبل الميلاد."],
      ["h", "متى وصل كولومبوس إلى الأمريكتين؟", "عام 1492م في رحلته الغربية للبحث عن طريق بحري إلى الهند، مما فتح عصر الاستكشافات الأوروبية."],
      ["h", "من هو ابن خلدون وبماذا اشتهر؟", "مؤرخ ومفكر عربي (1332–1406م) يُعد مؤسس علم الاجتماع الحديث من خلال كتابه الشهير «المقدمة» وعلم العمران البشري."],
      ["h", "ما الحضارة التي بنت مدينة البتراء؟", "الأنباط العرب في جنوب الأردن، الذين نحتوا واجهاتها المهيبة في الصخر الوردي وأبدعوا في هندسة المياه."],
      ["h", "متى فُتحت الأندلس ومن قاد الحملة؟", "عام 711م بقيادة طارق بن زياد ثم موسى بن نصير، لتبدأ حقبة حضارية امتدت قرابة ثمانية قرون."],
      ["h", "ما الإمبراطورية التي أسسها جنكيز خان؟", "الإمبراطورية المغولية في القرن الثالث عشر، وأصبحت أكبر إمبراطورية برية متصلة في تاريخ البشرية."],
      ["h", "من أول بعثة طافت حول الأرض بسفينة؟", "بعثة ماجلان (1519–1522م) التي أثبتت كروية الأرض عملياً، وأكملها إلكانو بعد مقتل ماجلان في الفلبين."],
      ["h", "متى بدأت الحروب الصليبية وكم استمرت؟", "نحو عام 1096م واستمرت حملاتها قرابة قرنين حتى تحرير عكا عام 1291م."],
      ["h", "من هي الملكة زنوبيا؟", "ملكة تدمر في بادية الشام بالقرن الثالث الميلادي، تحدّت الإمبراطورية الرومانية ووسّعت مملكتها لتشمل الشام ومصر."],
      ["h", "ما هي جامعة القرويين وأين تقع؟", "أقدم جامعة مستمرة في العالم؛ أسّستها فاطمة الفهرية في مدينة فاس المغربية عام 859م."],
      ["h", "من هو صلاح الدين الأيوبي؟", "قائد ومؤسس الدولة الأيوبية؛ وحّد مصر والشام وحرّر القدس عام 1187م بعد انتصاره في معركة حطين."],
      ["h", "ما هو سور الصين العظيم؟", "سلسلة تحصينات وأبراج دفاعية بُنيت عبر عدة سلالات صينية على مدار قرون لحماية الحدود الشمالية وتنظيم التجارة."],
      ["h", "متى ظهرت المطبعة الحديثة في أوروبا؟", "نحو عام 1450م على يد يوهان غوتنبرغ بالحروف المعدنية المتحركة، فأحدثت ثورة في نشر الكتب والمعرفة."],
      ["h", "من هو هيرودوت؟", "مؤرخ يوناني من القرن الخامس قبل الميلاد يُلقّب بـ«أبي التاريخ» لتدوينه المنهجي لأحداث الحروب اليونانية الفارسية."],
      ["h", "من اخترع الأبجدية الصوتية الأولى الشهيرة؟", "الفينيقيون على سواحل الشام، ومن أبجديتهم المكونة من 22 حرفاً تفرعت الأبجديات اليونانية واللاتينية والعربية."],
      ["h", "متى سقطت الدولة الأموية في المشرق؟", "عام 750م لتقوم بعدها الدولة العباسية، بينما أسس عبد الرحمن الداخل الإمارة الأموية في الأندلس."],
      ["h", "من هو ليوناردو دا فنشي؟", "فنان وعالم ومخترع إيطالي من عصر النهضة، رسم الموناليزا وصمّم مخططات لطائرات وغواصات سبقت عصره."],
      ["h", "من بنى مدينة ماتشو بيتشو؟", "حضارة الإنكا في جبال الأنديز ببيرو في القرن الخامس عشر بحجارة متعشّقة بدقة مذهلة دون ملاط."],
      ["h", "متى اندلعت الحرب العالمية الثانية ومتى انتهت؟", "اندلعت عام 1939م وانتهت عام 1945م، وأسفرت عن تأسيس الأمم المتحدة وبداية عصر الحرب الباردة."],
      ["h", "ما أصل الأرقام المستخدمة عالمياً اليوم؟", "نشأت أصولها في الهند وطوّرها العلماء العرب كالخوارزمي مع مفهوم الصفر، وانتقلت عبر الأندلس إلى أوروبا."],
      ["h", "من هو الرحالة ابن جبير؟", "أديب ورحالة أندلسي (1145–1217م) دوّن رحلته الشهيرة إلى المشرق والحجاز ومصر والشام وصقلية."],
      ["h", "ما هي الثورة الفرنسية ومتى اندلعت؟", "ثورة عام 1789م أنهت الحكم الملكي المطلق ورفعت شعار «الحرية والمساواة والإخاء» وأصدرت إعلان حقوق الإنسان."],
      ["h", "ما الاسم الحديث للقسطنطينية؟", "إسطنبول؛ وهي المدينة الكبرى الوحيدة الممتدة على قارتين (آسيا وأوروبا) عبر مضيق البوسفور."],
      ["h", "من هو الإسكندر الأكبر؟", "ملك مقدوني (356–323 ق.م) تتلمذ على يد أرسطو وأسس إمبراطورية شاسعة امتدت من اليونان حتى حدود الهند."],
      ["h", "من هو ماركو بولو؟", "تاجر ورحالة من البندقية سافر عبر طريق الحرير إلى الصين في القرن الثالث عشر ودوّن مشاهداته في كتاب ألهم أوروبا."],
      ["h", "من بنى قصر الحمراء في غرناطة؟", "ملوك بني نصر (النصريون) في القرنين الثالث عشر والرابع عشر، ويُعد درّة العمارة الإسلامية الأندلسية."],
      ["h", "من هو الإمام الشافعي وما إنجازه العلمي؟", "فقيه عربي (767–820م) وأول من دوّن علم «أصول الفقه» بصورة منهجية متكاملة في كتابه «الرسالة»."],
      ["h", "متى انتهت الخلافة العثمانية رسمياً؟", "عام 1924م مع قيام الجمهورية التركية الحديثة بعد أكثر من ستة قرون من الحكم العثماني."],
      ["h", "ما المقصود بالعصر الذهبي الإسلامي؟", "حقبة ازدهار علمي وثقافي امتدت تقريباً من القرن الثامن إلى الثالث عشر وشهدت طفرات في الطب والرياضيات والفلك."],
      ["h", "من هو أبو بكر الرازي؟", "طبيب وكيميائي (865–925م) ألّف «الحاوي في الطب» وكان أول من فرّق سريرياً بين الجدري والحصبة."],
      ["h", "متى أعلنت المستعمرات الأمريكية استقلالها؟", "في 4 يوليو 1776م بصدور إعلان الاستقلال عن التاج البريطاني لتنشأ الولايات المتحدة الأمريكية."],
      ["h", "ما مكانة قرطبة في عهد الأمويين؟", "أصبحت في القرن العاشر أكبر وأرقى حواضر أوروبا بشوارعها المضاءة ومكتبتها التي ضمّت مئات الآلاف من المجلدات."],
      ["h", "من هو الجغرافي الشريف الإدريسي؟", "جغرافي عربي (1100–1165م) رسم لملك صقلية أدق خريطة للعالم في العصور الوسطى ودوّن «نزهة المشتاق»."],
      ["h", "ما أهمية طريق الحرير تاريخياً؟", "شبكة تجارة برية وبحرية ربطت الصين بالشرق الأوسط وأوروبا، ونقلت السلع والورق والعلوم والأفكار بين الحضارات."],

      // ===================== [p] فلسفة وفكر (40 معلومة) =====================
      ["p", "ما فكرة سقراط الأشهر عن المعرفة؟", "أن الحكمة تبدأ بإدراك حدود ما نعرف، ويُنسب إليه القول الشهير: «أعرف شيئاً واحداً وهو أنني لا أعرف شيئاً»."],
      ["p", "ماذا قصد ديكارت بـ «أنا أفكر إذن أنا موجود»؟", "أن الشك نفسه فعل تفكير، وهو الدليل اليقيني القاطع على وجود ذاتٍ تفكر لا يمكن الشك في وجودها."],
      ["p", "ما رمز «كهف أفلاطون»؟", "تمثيل لأناس يظنون الظلال على الجدار حقيقةً، ويرمز لرحلة العقل من أسر الجهل والوهم إلى نور المعرفة."],
      ["p", "من هو ابن رشد وما أبرز أطروحته؟", "فيلسوف وقاضٍ أندلسي (1126–1198م) شرح أرسطو ودافع في «فصل المقال» عن العقل والتوافق التام بينه وبين الشريعة."],
      ["p", "من تلميذ سقراط ومعلم أرسطو؟", "أفلاطون؛ مؤسس «الأكاديمية» في أثينا وصاحب نظرية «عالم المُثُل» وكتاب «الجمهورية»."],
      ["p", "ما المذهب «الإمبريقي» (التجريبي) في الفلسفة؟", "مذهب يرى أن الحواس والخبرة هما المصدر الأساسي للمعرفة، ومن أبرز أعلامه جون لوك وديفيد هيوم."],
      ["p", "ما «الأمر المطلق» عند إيمانويل كانط؟", "مبدأ أخلاقي ينص على: افعل فقط وفق القاعدة التي تريد أن تصبح قانوناً عاماً للجميع، معاملةً للإنسان كغاية لا كوسيلة."],
      ["p", "ما هي «الأخلاق النفعية»؟", "مذهب أخلاقي يرى أن الفعل الصحيح هو الذي يحقق أكبر سعادة ومنفعة لأكبر عدد من الناس، ومن رواده بنثام وميل."],
      ["p", "ماذا تعني الفلسفة «الوجودية»؟", "فلسفة ترى أن الإنسان حر ومسؤول عن صناعة معنى لحياته عبر اختياراته، ومن أبرز أعلامها جان بول سارتر."],
      ["p", "ماذا فعل الغزالي في «تهافت الفلاسفة»؟", "انتقد فيه آراء بعض الفلاسفة بأدوات المنطق نفسها، وروى رحلته من الشك إلى اليقين في «المنقذ من الضلال»."],
      ["p", "ما المقصود بـ «السفسطة»؟", "حجاج لفظي خادع هدفه الإقناع والغلبة في الجدال لا الوصول إلى الحقيقة، وقد تصدّى لها سقراط وأفلاطون."],
      ["p", "من هو ابن سينا وما مكانته؟", "طبيب وفيلسوف موسوعي (980–1037م) لُقّب بالشيخ الرئيس؛ ألّف «القانون في الطب» الذي دُرّس في أوروبا قروناً."],
      ["p", "من هو أرسطو وبماذا لُقّب؟", "فيلسوف يوناني (384–322 ق.م) يُلقّب بـ«المعلم الأول»، أسس علم المنطق وكان معلماً للإسكندر الأكبر."],
      ["p", "ما هو «المنطق» عند أرسطو؟", "أداة لتمييز الاستدلال الصحيح من الخاطئ، وأشهر صوره القياس: كل إنسان فانٍ، وسقراط إنسان، إذن سقراط فانٍ."],
      ["p", "ما فكرة الفارابي عن «المدينة الفاضلة»؟", "مجتمع متعاون يحكمه رئيس حكيم، يتكامل أفراده لتحقيق السعادة والفضيلة كأعضاء الجسد الواحد."],
      ["p", "كيف يعرّف أرسطو «الفضيلة»؟", "بأنها «الوسط الذهبي» بين رذيلتين؛ فالشجاعة وسط بين التهور والجبن، والكرم وسط بين التبذير والبخل."],
      ["p", "ما «الشك المنهجي» عند ديكارت؟", "أسلوب عقلي يشك به الإنسان مؤقتاً في كل معرفة قابلة للريب حتى يصل إلى يقين صلب لا يتزعزع."],
      ["p", "ما هو «الجدل السقراطي»؟", "أسلوب حوار يعتمد على الأسئلة المتسلسلة لكشف تناقض أفكار المحاور وقيادته لاكتشاف الحقيقة بنفسه."],
      ["p", "ما نظرية «العقد الاجتماعي»؟", "فكرة أن الأفراد يتنازلون طوعاً عن جزء من حرياتهم للدولة مقابل الأمن والنظام والعدالة، وتناولها هوبز ولوك وروسو."],
      ["p", "ما «الحتمية» في الفلسفة؟", "رأي يذهب إلى أن كل حدث له سبب سابق يحدده بالضرورة، مما يطرح تساؤلاً عميقاً حول حرية الإرادة."],
      ["p", "من هو فريدريك نيتشه؟", "فيلسوف ألماني (1844–1900) اشتهر بنقد الأخلاق التقليدية وبمفاهيم «الإنسان الأعلى» و«إرادة القوة»."],
      ["p", "ما معنى مقولة سارتر «الإنسان محكوم بالحرية»؟", "أن الإنسان لا يستطيع الهروب من الاختيار، فهو مسؤول بالكامل عن قراراته وما يصنعه من نفسه."],
      ["p", "ما هي «النسبية الأخلاقية»؟", "موقف يرى أن معايير الصواب والخطأ ليست مطلقة بل تختلف باختلاف الثقافات والأزمنة والأفراد."],
      ["p", "من هو إيمانويل كانط وما ثورته الفلسفية؟", "فيلسوف ألماني (1724–1804) وفّق بين العقلانية والتجريبية في «نقد العقل الخالص»، مؤكداً دور العقل في تنظيم التجربة."],
      ["p", "من هو باروخ سبينوزا؟", "فيلسوف هولندي (1632–1677) تبنّى مذهب «وحدة الوجود» معتبراً أن الطبيعة والوجود جوهر واحد محكوم بنظام عقلي."],
      ["p", "ما هي «العدمية»؟", "موقف فلسفي يرى أن الحياة والوجود يفتقران إلى معنى جوهري أو قيمة موضوعية مسبقة."],
      ["p", "ما علم «الإبستمولوجيا»؟", "فرع الفلسفة الذي يدرس نظرية المعرفة: طبيعتها ومصادرها وحدودها ومعايير صدقها."],
      ["p", "ما هي «الميتافيزيقا»؟", "فرع الفلسفة الذي يبحث في طبيعة الوجود والواقع والزمان والمكان والمبادئ الأولى لما وراء المحسوسات."],
      ["p", "ما المقصود بـ «الحدس» عند هنري برجسون؟", "إدراك مباشر ومتعاطف مع الزمن وتدفق الحياة يرى برجسون أنه يتجاوز حدود التحليل العقلي المجزَّأ."],
      ["p", "من هو ابن طفيل وما قصته الفلسفية الشهيرة؟", "فيلسوف أندلسي كتب «حي بن يقظان»، قصة طفل نشأ وحيداً في جزيرة واهتدى بعقله وتأمله إلى الحقائق الكبرى."],
      ["p", "بماذا وصف جون لوك العقل البشري عند الولادة؟", "بأنه «صفحة بيضاء» خالية من الأفكار الفطرية، وتملؤها الخبرة والحواس تدريجياً بالتعلم."],
      ["p", "ما الفرق بين «المثالية» و«المادية» في الفلسفة؟", "المثالية تعطي الأولوية للعقل والأفكار والوعي، بينما ترى المادية أن المادة والطاقة هما أساس كل ما هو موجود."],
      ["p", "من هي حنة أرندت وما مفهوم «تفاهة الشر»؟", "فيلسوفة سياسية درست الشمولية، وبيّنت أن الفظائع الكبرى قد يرتكبها أناس عاديون يتوقفون عن التفكير النقدي."],
      ["p", "ما هي «البراغماتية»؟", "مدرسة فلسفية تقيس صحة الفكرة بجدواها العملية ونتائجها الملموسة في الواقع."],
      ["p", "ما جوهر المدرسة «الرواقية» (Stoicism)؟", "فلسفة تدعو لضبط الانفعالات والتحلي بالسكينة والتركيز فقط على ما نملك السيطرة عليه وقبول ما لا نستطيع تغييره."],
      ["p", "من هو كونفوشيوس؟", "فيلسوف صيني (551–479 ق.م) ركّزت تعاليمه على الأخلاق وبناء العلاقات الاجتماعية المتناغمة واحترام الوالدين."],
      ["p", "ما هي الفلسفة «الطاوية»؟", "فلسفة صينية تدعو إلى العيش ببساطة وتناغم عفوي مع الطبيعة وتجنّب التكلّف والصراع غير الضروري."],
      ["p", "ما هي المدرسة «الأبيقورية»؟", "فلسفة يونانية ترى أن السعادة الحقيقية تكمن في الطمأنينة واللذة الهادئة وغياب الألم الجسدي والاضطراب النفسي."],
      ["p", "من هو محيي الدين بن عربي؟", "متصوف وفيلسوف أندلسي (1165–1240م) لُقّب بالشيخ الأكبر واشتهر بكتابه «الفتوحات المكية»."],
      ["p", "كيف تعمل «الجدلية» عند هيغل؟", "يرى أن الفكر والتاريخ يتطوران عبر صراع بين فكرة ونقيضها، ليُثمر الصراع عن تركيب جديد يرتقي بهما."],

      // ===================== [l] أدب ولغة (25 معلومة) =====================
      ["l", "ما هي «المعلقات» في الشعر العربي؟", "أشهر وأجود قصائد الشعر الجاهلي الطوال؛ من شعرائها امرؤ القيس وعنترة وزهير بن أبي سلمى وطرفة بن العبد."],
      ["l", "من هو أبو الطيب المتنبي؟", "شاعر عربي عبقري (915–965م) امتاز شعره بالحكمة والفخر وجزالة اللفظ حتى صارت أبياته أمثالاً سائرة عبر العصور."],
      ["l", "من هو الجاحظ وما أبرز مؤلفاته؟", "عميد النثر العباسي (776–868م)؛ جمع بين التحليل العلمي والفكاهة في «البيان والتبيين» و«الحيوان» و«البخلاء»."],
      ["l", "ما هي حكايات «ألف ليلة وليلة»؟", "مجموعة قصصية شرقية خالدة ترويها شهرزاد للملك شهريار وتضم السندباد وعلاء الدين، وألهمت الأدب العالمي قروناً."],
      ["l", "من هو الخليل بن أحمد الفراهيدي؟", "عالم لغوي عبقري من البصرة وضع «علم العروض» لضبط أوزان الشعر العربي، وألّف «كتاب العين» كأول معجم عربي."],
      ["l", "من هو سيبويه وما كتابه الأشهر؟", "إمام النحاة العرب وتلميذ الخليل؛ ألّف أعظم مرجع في النحو العربي واشتهر تقديراً لمكانته باسم «الكتاب»."],
      ["l", "من أول أديب عربي فاز بجائزة نوبل في الأدب؟", "الروائي المصري نجيب محفوظ عام 1988م عن مجمل أعماله كـ«الثلاثية» و«زقاق المدق» و«أولاد حارتنا»."],
      ["l", "من هو جبران خليل جبران وما كتابه العالمي الأشهر؟", "أديب وفنان لبناني من رواد المهجر؛ يُعد كتابه «النبي» من أكثر الكتب ترجمةً وانتشاراً في العالم."],
      ["l", "ما دور بدر شاكر السياب في الشعر الحديث؟", "شاعر عراقي رائد أسهم مع نازك الملائكة في تأسيس «شعر التفعيلة» (الشعر الحر)، ومن أشهر قصائده «أنشودة المطر»."],
      ["l", "ما هي «الموشحات» الأندلسية؟", "فن شعري غنائي نشأ في الأندلس في القرن التاسع، يتميز بتعدد أوزانه وتنوع قوافيه وارتباطه الوثيق بالموسيقى."],
      ["l", "ما كتاب «كليلة ودمنة» ومن نقله للعربية؟", "كتاب حِكم وأمثال سياسية وأخلاقية على ألسنة الحيوانات، ترجمه ابن المقفع بأسلوب عربي بليغ فأصبح من روائع النثر."],
      ["l", "من هو ويليام شكسبير؟", "شاعر وكاتب مسرحي إنجليزي (1564–1616) خلّد مآسي وكوميديات عالمية مثل «هاملت» و«ماكبث» و«روميو وجولييت»."],
      ["l", "بماذا اشتهر الروائي الروسي دوستويفسكي؟", "رائد الرواية النفسية والفلسفية؛ سبر صراعات الضمير والذنب والحرية في «الجريمة والعقاب» و«الإخوة كارامازوف»."],
      ["l", "ما هي «الواقعية السحرية» ومن أبرز روادها؟", "أسلوب أدبي يمزج الواقع اليومي بالخيال والأسطورة، وبلغ ذروته في «مئة عام من العزلة» لغابرييل غارسيا ماركيز."],
      ["l", "لماذا تُسمّى اللغة العربية «لغة الضاد»؟", "لأن صوت حرف الضاد بصفته الفصيحة القديمة كان يُعد فريداً في مخارجه بين اللغات الإنسانية المعروفة آنذاك."],
      ["l", "ما هو فن «المقامات» في الأدب العربي؟", "قصص قصيرة مصوغة بنثر مسجوع رفيع تجمع بين الطرافة والبلاغة، ابتكرها بديع الزمان الهمذاني وطورها الحريري."],
      ["l", "من هو «عميد الأدب العربي» وما سيرته الذاتية الأشهر؟", "الأديب المصري طه حسين الذي تحدى فقدان البصر ليقود نهضة التعليم والنقد، وخلّد طفولته في كتابه «الأيام»."],
      ["l", "ما أقدم ملحمة أدبية مكتوبة في تاريخ البشرية؟", "«ملحمة جلجامش» التي دُوّنت بالمسمارية في بلاد الرافدين قبل نحو 4,000 عام وتبحث في الصداقة والسعي للخلود."],
      ["l", "ما هو شعر «الهايكو» الياباني؟", "قصيدة موجزة من 17 مقطعاً صوتياً في ثلاثة أسطر (5-7-5) تلتقط بتأمل عميق لحظة عابرة في الطبيعة."],
      ["l", "من هو أبو العلاء المعري؟", "شاعر وفيلسوف عربي عُرف بـ«رهين المحبسين»، ومن أبرز أعماله «اللزوميات» و«رسالة الغفران»."],
      ["l", "من مؤلف «الكوميديا الإلهية»؟", "الشاعر الإيطالي دانتي أليغييري في القرن الرابع عشر، وكتبها بالإيطالية الدارجة فأسس للغة الإيطالية الحديثة."],
      ["l", "ما أشهر معجم لغوي تراثي شامل في العربية؟", "معجم «لسان العرب» لابن منظور، الذي جمع خلاصة خمسة معاجم كبرى وضم قرابة 80 ألف مادة لغوية."],
      ["l", "ما فروع علم البلاغة العربية الثلاثة؟", "علم المعاني (مطابقة الكلام لمقتضى الحال)، وعلم البيان (التشبيه والاستعارة والكناية)، وعلم البديع (المحسنات)."],
      ["l", "من هو الشاعر محمود درويش؟", "من أبرز شعراء العربية المعاصرين، ارتبط شعره بفلسطين والهوية والإنسانية بأسلوب جمالي وإيقاع عالمي."],
      ["l", "كم عدد جذور الكلمات التقريبي في العربية؟", "تضم العربية نحو 12 ألف جذر لغوي تولّد بالاشتقاق ملايين المفردات الدقيقة، مما يجعلها من أغنى لغات العالم."],

      // ===================== [g] جغرافيا وعجائب (25 معلومة) =====================
      ["g", "ما أطول نهر وأغزر نهر في العالم؟", "نهر النيل في أفريقيا هو الأطول بنحو 6,650 كم، بينما نهر الأمازون في أمريكا الجنوبية هو الأغزر مياهاً والأكبر حوضاً."],
      ["g", "ما أعلى قمة جبلية فوق مستوى سطح البحر؟", "قمة إيفرست في جبال الهيمالايا بارتفاع 8,848.86 متراً، ولا تزال ترتفع بضعة مليمترات سنوياً."],
      ["g", "ما هي صحراء الربع الخالي؟", "أكبر صحراء رملية متصلة في العالم؛ تغطي الثلث الجنوبي من شبه الجزيرة العربية بمساحة تقارب 650 ألف كم²."],
      ["g", "لماذا تطفو الأجسام بسهولة في البحر الميت؟", "لأنه أخفض نقطة يابسة على الأرض (-430 م) وتبلغ ملوحته نحو 34%، ما يرفع كثافة مائه بشكل كبير."],
      ["g", "ما أعلى شلال متواصل في العالم؟", "شلالات «آنجل» في فنزويلا بارتفاع إجمالي يبلغ 979 متراً، حيث تتحول المياه إلى رذاذ قبل بلوغ القاع."],
      ["g", "ما هو الحاجز المرجاني العظيم؟", "أضخم منظومة حية من الشعاب المرجانية على الأرض؛ يمتد لأكثر من 2,300 كم قبالة ساحل أستراليا ويُرى من الفضاء."],
      ["g", "ما سبب ظاهرة الشفق القطبي (Aurora)؟", "تصادم الجسيمات المشحونة القادمة من الرياح الشمسية مع ذرات الأكسجين والنيتروجين في أعالي الغلاف الجوي قرب القطبين."],
      ["g", "ما أطول سلسلة جبلية قارية على اليابسة؟", "جبال الأنديز في غرب أمريكا الجنوبية، وتمتد لمسافة تتجاوز 7,000 كيلومتر عبر سبع دول."],
      ["g", "ما أهمية قناة السويس ومضيق هرمز؟", "تربط قناة السويس البحر المتوسط بالأحمر فتختصر التجارة العالمية، بينما يربط مضيق هرمز الخليج العربي ببحر العرب."],
      ["g", "ما أكبر صحراء على كوكب الأرض مساحةً؟", "القارة القطبية الجنوبية (أنتاركتيكا) كصحراء جليدية باردة بمساحة 14 مليون كم²، تليها الصحراء الكبرى كأكبر صحراء حارة."],
      ["g", "ما العجيبة الوحيدة الباقية من عجائب الدنيا السبع القديمة؟", "الهرم الأكبر في الجيزة بمصر، بينما اندثرت بقية العجائب القديمة كحدائق بابل ومنارة الإسكندرية بفعل الزمن والزلازل."],
      ["g", "ما مكانة مدينة بابل التاريخية في العراق؟", "إحدى أعظم حواضر العالم القديم على ضفاف الفرات؛ اشتهرت ببوابة عشتار وشريعة حمورابي والحدائق المعلقة."],
      ["g", "ما أكثر صحراء غير قطبية جفافاً في العالم؟", "صحراء «أتاكاما» في شمال تشيلي، وتُستخدم تربتها الشبيهة بالمريخ لاختبار مركبات الفضاء."],
      ["g", "ما هي «نقطة نيمو» في المحيط الهادئ؟", "أبعد نقطة بحرية عن أي يابسة على الكوكب، حتى إن رواد محطة الفضاء الدولية يكونون أحياناً أقرب البشر إليها."],
      ["g", "ما هي «حلقة النار» في المحيط الهادئ؟", "حزام جيولوجي نشط يحيط بالمحيط الهادئ وتقع فيه نحو 90% من زلازل العالم و75% من براكينه النشطة."],
      ["g", "ما أعمق نقطة في محيطات العالم؟", "«تشالنجر ديب» في خندق ماريانا بالمحيط الهادئ، بعمق يصل إلى نحو 11 كيلومتراً تحت سطح البحر."],
      ["g", "ما أكبر محيط وأكبر قارة على الأرض؟", "المحيط الهادئ هو الأكبر ويغطي نحو ثلث سطح الكوكب، وآسيا هي أكبر القارات مساحةً وسكاناً."],
      ["g", "بماذا تشتهر جزر غالاباغوس؟", "أرخبيل بركاني معزول في الإكوادور يضم كائنات فريدة ألهمت تشارلز داروين في صياغة نظرية التطور."],
      ["g", "ما هي ظاهرة «شمس منتصف الليل»؟", "ظاهرة تحدث صيفاً قرب القطبين بسبب ميل محور الأرض، حيث لا تغرب الشمس وتبقى مرئية طوال 24 ساعة."],
      ["g", "ما أعمق بحيرة مياه عذبة في العالم؟", "بحيرة بايكال في سيبيريا بعمق 1,642 متراً، وتحتوي وحدها على نحو 20% من المياه العذبة السائلة على الأرض."],

    // المصفوفة الموحدة النشطة: (معلومات Google Sheets أولاً + الموسوعة المدمجة)

    // دوال مساعدة أساسية
    function todayNum() {
      const d = new Date();
      return Math.floor((d.getTime() - d.getTimezoneOffset() * 60000) / 86400000);
    }

    function esc(str) {
      return String(str == null ? "" : str).replace(/[&<>"]/g, c => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"
      }[c]));
    }

    /**
     * تطبيع النصوص العربية للمقارنة ومنع التكرار الدقيق
     * يوحّد الهمزات والتاء المربوطة ويزيل علامات الترقيم والمسافات الزائدة
     */
    function normalizeArabic(str) {
      return String(str || "")
        .trim()
        .replace(/[\u064B-\u065F\u0670]/g, "") // إزالة التشكيل
        .replace(/[أإآ]/g, "ا")
        .replace(/ة/g, "ه")
        .replace(/ى/g, "ي")
        .replace(/[؟?!.،,:;؛«»"']/g, "")
        .replace(/\s+/g, " ")
        .toLowerCase();
    }

    function loadState() {

      // ضمان وجود معرف الجدول الافتراضي إذا لم يُحدد مسبقاً
      if (!state.sheetId && !state.sheetRawUrl) {
        state.sheetId = DEFAULT_SHEET_ID;
